<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍊 오렌지 실습실 · 데이터 과학 프로젝트 시뮬레이터</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#fcfcfb; --card:#fff; --line:#e4e2dc; --line-2:#d3d0c8;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#86847e;
  --accent:#2a78d6; --accent-soft:#e8f1fc; --good:#1a7f37; --warn:#b26b00; --bad:#c62828;
  --o-data:#ffd39f; --o-transform:#ff9d5e; --o-visual:#ffb7b1; --o-model:#fac1d9; --o-eval:#c3f3f3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
button,select,input{font:inherit}
header.top{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#4b2c7a,#7a4fb0);color:#fff;padding:10px 16px}
header.top h1{margin:0;font-size:1.15rem}
header.top .sub{font-size:.82rem;opacity:.85}
header.top .sp{flex:1}
header.top a,header.top button{color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 12px;text-decoration:none;font-size:.85rem;cursor:pointer;white-space:nowrap}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;height:calc(100vh - 54px)}
/* 위젯 목록 */
.toolbox{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.toolbox h4{margin:10px 4px 4px;font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.toolbox h4 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tool{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:4px 6px;cursor:grab;text-align:left;font-size:.86rem;color:var(--ink)}
.tool:hover{background:#fff;border-color:var(--line)}
.tool .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex:0 0 28px}
.toolhelp{font-size:.75rem;color:var(--ink-3);margin:12px 4px;line-height:1.45}
/* 캔버스 */
.canvas-wrap{position:relative;overflow:auto;background:#fff;background-image:radial-gradient(#e6e3dc 1px,transparent 1px);background-size:20px 20px}
#canvas{position:relative;width:1500px;height:1000px}
#links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#links path.ln{fill:none;stroke:#8c8a84;stroke-width:2.2}
#links path.ln.empty{stroke-dasharray:6 5;stroke:#b9b6ae}
#links path.ln.sel{stroke:var(--accent);stroke-width:3.4}
#links path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
#links text{font-size:11px;fill:#6d6b65;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
#links path.temp{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 4}
.node{position:absolute;width:110px;margin-left:-55px;margin-top:-32px;text-align:center;user-select:none;touch-action:none}
.node .circle{position:relative;width:64px;height:64px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:3px solid rgba(0,0,0,.08);box-shadow:0 2px 4px rgba(0,0,0,.08);cursor:move}
.node.sel .circle{outline:3px solid var(--accent);outline-offset:3px}
.node .title{font-size:.8rem;margin-top:4px;line-height:1.2;word-break:keep-all}
.node .sum{font-size:.7rem;color:var(--ink-3)}
.port{position:absolute;top:22px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #8c8a84}
.port.in{left:-10px}
.port.out{right:-10px;cursor:crosshair}
.port.out:hover,.port.out.hot{background:var(--accent);border-color:var(--accent)}
.node.drop-ok .circle{box-shadow:0 0 0 5px rgba(42,120,214,.35)}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;font-size:.72rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 5px}
.badge.error{background:var(--bad)}.badge.warn{background:#e39b00}
.canvas-tools{position:sticky;top:8px;left:8px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:0 8px;height:0;overflow:visible}
.canvas-tools button{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:4px 10px;font-size:.82rem;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.canvas-tools button:disabled{opacity:.45;cursor:default}
.empty-hint{position:absolute;left:60px;top:200px;color:var(--ink-3);text-align:center;pointer-events:none;font-size:.95rem;line-height:1.8}
/* 미션 */
.missions{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:12px}
.missions h2{font-size:1rem;margin:0 0 4px}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.pbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.mstage{font-size:.75rem;font-weight:700;color:#7a4fb0;margin:12px 0 4px}
.mission{border:1px solid var(--line);background:#fff;border-radius:10px;margin:6px 0;overflow:hidden}
.mission>.mh{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;cursor:pointer;font-size:.88rem}
.mission .st{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:var(--ink-3)}
.mission.done .st{background:var(--good);border-color:var(--good);color:#fff}
.mission.cur{border-color:#7a4fb0;box-shadow:0 0 0 2px rgba(122,79,176,.15)}
.mission .mb{padding:0 12px 10px 40px;font-size:.84rem;color:var(--ink-2);display:none}
.mission.open .mb{display:block}
.mission .mb ol{margin:4px 0;padding-left:18px}.mission .mb li{margin:3px 0}
.mission .quiz{margin-top:8px;background:#f4f2fb;border:1px solid #ddd6f3;border-radius:8px;padding:8px}
.mission .quiz .q{font-weight:700;color:var(--ink);margin-bottom:6px}
.mission .quiz input{width:90px;padding:4px 6px;border:1px solid var(--line-2);border-radius:6px}
.mission .quiz button{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:3px 9px;margin:2px;cursor:pointer;font-size:.82rem}
.mission .quiz button.go{background:#7a4fb0;color:#fff;border-color:#7a4fb0}
.mission .quiz .fb{margin-top:5px;font-size:.82rem}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.w-tag{display:inline-block;padding:0 6px;border-radius:4px;font-weight:700;color:var(--ink);font-size:.8rem}
.kbd{display:inline-block;font-size:.78rem;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:#fff}
/* 위젯 창 */
.owin{position:fixed;z-index:30;background:#fff;border:1px solid #b9b6ae;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);width:620px;max-width:calc(100vw - 16px);max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.owin .wh{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#efede8;border-bottom:1px solid var(--line-2);border-radius:10px 10px 0 0;cursor:move;user-select:none;touch-action:none}
.owin .wh .ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.owin .wh b{flex:1;font-size:.9rem}
.owin .wh button{border:none;background:none;font-size:1.1rem;cursor:pointer;color:var(--ink-2);padding:0 4px}
.owin .wb{overflow:auto;padding:12px;font-size:.88rem}
.owin .status{border-top:1px solid var(--line);padding:5px 10px;font-size:.78rem;color:var(--ink-2);background:#faf9f6;border-radius:0 0 10px 10px}
.wgrid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px}
@media(max-width:640px){.wgrid{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line-2);border-radius:8px;margin:0 0 10px;padding:6px 10px 8px}
legend{font-size:.8rem;font-weight:700;color:var(--ink-2);padding:0 4px}
fieldset label{display:block;margin:3px 0}
.info{font-size:.82rem;color:var(--ink-2);line-height:1.6}
table.ot{border-collapse:collapse;width:100%;font-size:.8rem}
table.ot th,table.ot td{border:1px solid #e6e4de;padding:3px 6px;text-align:left;white-space:nowrap}
table.ot th{background:#f3f1ec;position:sticky;top:0}
table.ot td.n{text-align:right;font-variant-numeric:tabular-nums}
table.ot td.miss{background:#fdecea;color:var(--bad);text-align:center}
table.ot .tgt{background:#eef0fb}
table.ot tr.best td{background:#eef7ee;font-weight:700}
.tscroll{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.obtn{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.84rem}
.obtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.obtn.hl{background:#ff9d5e;border-color:#e0782f;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,157,94,.35)}}
.cond{display:flex;gap:4px;align-items:center;margin:4px 0;flex-wrap:wrap}
.cond select,.cond input{padding:3px 5px;border:1px solid var(--line-2);border-radius:5px;font-size:.82rem}
.cond input{width:72px}
.cols3{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:start}
.lbox{border:1px solid var(--line-2);border-radius:6px;min-height:60px;padding:3px;background:#fff}
.lbox .it{padding:2px 6px;border-radius:4px;cursor:pointer;font-size:.82rem}
.lbox .it.on{background:var(--accent);color:#fff}
.lbox h5{margin:0 0 3px;font-size:.75rem;color:var(--ink-3)}
.mv{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.mv button{padding:2px 0}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.82rem;margin:8px 0}
.note.warn{border-color:var(--warn);background:#fff6e5}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--ink-2);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
svg.chart{width:100%;height:auto;display:block}
svg text{font-family:inherit}
/* 링크 편집 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:16px 18px;width:420px;max-width:calc(100vw - 20px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font-size:1rem}
.modal label{display:block;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.toast.good{background:var(--good)}
@media(max-width:1000px){
  .app{grid-template-columns:1fr;height:auto}
  .toolbox{border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;max-height:none}
  .toolbox h4{width:100%}
  .tool{width:auto}
  .toolhelp{display:none}
  .canvas-wrap{height:70vh}
  .missions{border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>🍊 오렌지 실습실</h1>
    <div class="sub">위젯을 끌어다 놓고 → 선으로 잇고 → 더블클릭해서 설정하며 스트레스 지수 예측 워크플로를 직접 만들어 보세요</div>
  </div>
  <div class="sp"></div>
  <button id="btnExample" title="교과서 완성 워크플로를 캔버스에 불러옵니다">완성 예시 보기</button>
  <button id="btnClear">캔버스 비우기</button>
  <a href="index.html">← 시뮬레이터로</a>
</header>
<div class="app">
  <aside class="toolbox" id="toolbox"></aside>
  <div class="canvas-wrap" id="wrap">
    <div class="canvas-tools">
      <button id="tOpen" disabled>🔍 열기</button>
      <button id="tLink" disabled>🔗 연결 편집</button>
      <button id="tDel" disabled>🗑 삭제</button>
    </div>
    <div id="canvas">
      <svg id="links"></svg>
      <div class="empty-hint" id="emptyHint">왼쪽 <b>Data</b> 목록의 <b>📄 File</b> 위젯을 여기로 끌어오세요<br>(위젯을 클릭해도 캔버스에 놓여요)</div>
    </div>
  </div>
  <aside class="missions" id="missions"></aside>
</div>
<div class="toast" id="toast"></div>
<script src="engine.js"></script>
<script src="orange.js"></script>
</body>
</html>
